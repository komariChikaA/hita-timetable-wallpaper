plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.ui'
    defaultConfig {
        applicationId "com.example.ui"
        minSdkVersion 23
        targetSdk 33
        compileSdk 35
        versionCode 1
        versionName "0.1.0"
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    composeOptions {
        // 与宿主 Kotlin 1.9.22 匹配
        kotlinCompilerExtensionVersion '1.5.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

// 界面插件：APK 文件由市场下载，宿主用 DexClassLoader 加载，Compose 由宿主提供运行时。
dependencies {
    compileOnly files('../libs/api-release.aar', '../libs/model-release.aar', '../libs/component-release.aar')
    compileOnly 'androidx.compose.runtime:runtime:1.6.8'
    compileOnly 'androidx.compose.ui:ui:1.6.8'
    compileOnly 'androidx.compose.foundation:foundation:1.6.8'
    compileOnly 'androidx.compose.material:material:1.6.8'
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
